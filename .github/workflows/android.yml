name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Strip spaces / Windows line endings that copy-paste may add.
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.p12" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-paste the whole content of release.p12.base64."
              exit 1
            fi
            if ! openssl pkcs12 -in "$RUNNER_TEMP/release.p12" -passin env:ANDROID_KEYSTORE_PASSWORD -nokeys -noout 2>/dev/null; then
              echo "::error::Keystore could not be opened. Check ANDROID_KEYSTORE_PASSWORD (and that the base64 secret is complete)."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release tags need the ANDROID_KEYSTORE_* secrets (see README)."
            exit 1
          else
            echo "::warning::No signing secrets: APK is signed with a throwaway debug key (test only)."
          fi

      - name: Run tests and build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::add-matcher::.github/kotlin-problem-matcher.json"
          set -o pipefail
          gradle --no-daemon test assembleRelease 2>&1 | tee build.log

      - name: Show why the build failed
        if: failure()
        run: |
          # Turn Gradle's "What went wrong" section into annotations, readable on the run page.
          grep -A 12 "What went wrong" build.log | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          grep -E "FAILED|Test.*>.*FAILED" build.log | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then LABEL="$GITHUB_REF_NAME"; else LABEL="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/easyClassShare-$LABEL.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: easyClassShare-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          # Tags like v1.3.0-beta.1 become pre-releases (not shown as "Latest").
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## 📲 Install on a device
            1. Open this page on the device and tap the **.apk** file below.
            2. If asked, allow your browser to *install unknown apps*.
            3. Tap **Install**. Done! 🎉

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.
